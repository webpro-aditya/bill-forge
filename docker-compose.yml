version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: bill-forge-app
    container_name: bill-forge-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    networks:
      - bill-forge-network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: bill-forge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - bill-forge-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: bill-forge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bill_forge}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-forge}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - bill-forge-network

  redis:
    image: redis:alpine
    container_name: bill-forge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bill-forge-network

networks:
  bill-forge-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
